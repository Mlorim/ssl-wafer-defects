dataset:
  path: "data/raw/LSWMD.pkl"
  labeled_ratio: 0.10
  image_size: 96
  rotation_degrees: 180.0
  noise_std: 0.10
  cutout_scale: [0.08, 0.20]
  max_labeled_samples: 90
  max_unlabeled_samples: 180
  max_eval_samples: 90
  seed: 42

model:
  num_classes: 9
  backbone: "resnet18"
  dropout: 0.5

method:
  name: "climex"
  iterations: 4
  threshold_update_every: 2
  eval_every_iterations: 2
  majority_class_index: 8
  majority_threshold: 0.95
  threshold_momentum: 0.8
  threshold_statistics: "rolling_window"

train:
  batch_size: 18
  epochs: 1
  lr: 0.001
  optimizer: "adam"
  weight_decay: 0.0
  device: "auto"
  num_workers: 0
  scheduler: "none"

eval:
  metrics: ["accuracy", "precision", "recall", "f1"]
  per_class: true
  eval_every: 1

output:
  results_dir: "results"
  checkpoint_path: "results/climex_smoke_checkpoint.pt"
  results_path: "results/climex_smoke_results.json"

paper_metrics:
  climex: {f1: 0.842}
