# Смоук-версия configs/cbam_cnn.yaml: минимальные эпохи (CAE + основной цикл),
# маленький target_per_class, чтобы за пару минут проверить весь пайплайн
# (native 26x26 filtering -> one-hot -> CAE-балансировка -> CBAM-CNN train)
# без ошибок, прежде чем гнать полный прогон.

dataset:
  path: "data/raw/LSWMD.pkl"
  native_size: 26
  target_per_class: 20   # маленький target для быстрой проверки
  cae_epochs: 1
  cae_noise_std: 0.1
  val_ratio: 0.1
  seed: 42

model:
  input_channels: 3
  num_classes: 9
  conv1_channels: 32
  conv2_channels: 72
  cbam_reduction: 8
  hidden_dim: 128

method:
  name: "cbam_cnn"
  max_epochs: 2
  patience: 2

train:
  batch_size: 32
  epochs: 2
  lr: 0.0001
  optimizer: "adam"
  weight_decay: 0.0
  device: "auto"
  num_workers: 0

eval:
  metrics: ["accuracy", "precision", "recall", "f1"]
  per_class: true
  eval_every: 1

output:
  results_dir: "results"
  checkpoint_path: "results/cbam_cnn_smoke_checkpoint.pt"
  results_path: "results/cbam_cnn_smoke_results.json"

paper_metrics:
  cbam_cnn: {accuracy: 0.9988, precision: 0.9956, recall: 0.9900, f1: 0.9983}
